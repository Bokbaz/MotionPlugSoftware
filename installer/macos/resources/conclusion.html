<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { color: #1d1d1f; font-family: -apple-system, "Helvetica Neue", sans-serif; font-size: 13px; margin: 16px 20px; }
  h1 { font-size: 17px; margin: 0 0 10px; }
  p { line-height: 1.5; margin: 0 0 10px; }
  ol { margin: 0 0 10px; padding-left: 22px; }
  li { line-height: 1.45; margin-bottom: 6px; }
  .kbd { background: #f2f2f4; border: 1px solid #d9d9de; border-radius: 4px; font-size: 12px; padding: 1px 5px; }
  .dim { color: #6e6e73; font-size: 12px; }
</style>
</head>
<body>
  <h1>Motion Plug is installed</h1>
  <ol>
    <li><b>Open Premiere Pro</b>, or restart it if it was running.</li>
    <li>Go to <span class="kbd">Window&nbsp;▸&nbsp;Extensions&nbsp;▸&nbsp;Motion&nbsp;Plug</span>.</li>
    <li>Choose a preset, customize it, and add it at the playhead.</li>
  </ol>
  <p class="dim">Motion Plug works offline and does not require an account.</p>
</body>
</html>
